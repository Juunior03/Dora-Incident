server {
    listen 80;
    server_name localhost;

    # Ne pas annoncer la version de nginx
    server_tokens off;

    # En-têtes de sécurité (hérités par les blocs location qui n'en définissent pas)
    # CSP : scripts et styles servis par l'application uniquement ; appels réseau vers
    # Supabase (HTTPS / WebSocket) et l'API publique du GLEIF ; pas d'intégration en iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
